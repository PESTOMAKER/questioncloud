<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuestionCloud - Maintenance</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #102d59, #2676c9);
            font-family: Arial, sans-serif;
            color: white;
            text-align: center;
        }

        .container {
            padding: 40px;
            max-width: 700px;
        }

        .cloud {
            font-size: 80px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 38px;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        p {
            font-size: 20px;
            line-height: 1.6;
            color: #d5e9ff;
        }

        .date {
            margin-top: 15px;
            font-size: 24px;
            font-weight: bold;
            color: #ffffff;
        }

        .line {
            width: 100px;
            height: 4px;
            background: #83c5ff;
            margin: 25px auto;
            border-radius: 10px;
        }

        .footer {
            margin-top: 50px;
            font-size: 13px;
            color: #b5d7f5;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="cloud">☁️</div>

        <h1>CURRENTLY UNDER MAINTENANCE</h1>

        <div class="line"></div>

        <p>
            We're making improvements to QuestionCloud
            to provide you with a better experience.
        </p>

        <div class="date">
            WILL BE BACK ON 12/1/3026
        </div>

        <div class="footer">
            © 2026 QuestionCloud. All rights reserved.
        </div>

    </div>

</body>
</html>
